<html>
    <head>
        <style>
            :root {
                --primary-color: blue;
                --secondary-color: red;
                --text-size: 30px;
            }
            .container {
                display: grid;
                height: 500px;
                width: 500px;
                grid-template-columns: 1fr 1fr 1fr;
                grid-template-rows: 1fr 1fr 1fr;
            }
            .parent{
                display: grid;
                font-size: calc(var(--text-size)*2);
                grid-template-columns: subgrid;
                grid-template-rows: subgrid;
                grid-column: 1/3;
                grid-row: 1/3;
               background-color: var(--primary-color);
            }
            .child{
               background-color: var(--secondary-color);
                grid-column: 1/2;
                grid-row: 1/2;

            }
        </style>
    </head>
    <body>
        <div class = "container">
            <div class = "parent">
                <div class = "child">1</div>
            </div>
        </div>
    </body>
</html>

<!DOCTYPE html>
<html>
<head>
  <style>
    .face {
      width: 300px;
      height: 300px;
      background: #f5cfa0;
      border-radius: 50%;
      position: relative;
      margin: 50px auto;
    }

    .moustache::before,
    .moustache::after {
      content: "";
      position: absolute;
      width: 100px;
      height: 50px;
      background: black;
      top: 160px;
    }

    .moustache::before {
      left: 50px;
      border-radius: 100% 0 100% 20%;
      transform: rotate(15deg);
    }

    .moustache::after {
      right: 50px;
      border-radius: 0 100% 20% 100%;
      transform: rotate(-15deg);
    }
  </style>
</head>

<body>

  <div class="face">
    <div class="moustache"></div>
  </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
</head>
<body>
    <h1>Guess the Number Game</h1>
    <p>Play against the computer. You have 10 chances to guess the number.</p>
    <input type="number" id="guessInput" placeholder="Enter your guess">
    <button id="guessButton" type="button">Submit Guess</button>
    <p id="result"></p>
    <script>
        const randomNumber = Math.floor(Math.random() * 100) + 1;
        let attempts = 0;
        let chances = 10;

        function checkGuess() {
            const guessInput = document.getElementById("guessInput");
            const result = document.getElementById("result");
            const userGuess = parseInt(guessInput.value, 10);
            attempts++;
            chances--;

            if (chances === 0) {
                result.textContent = "Game over! The number was " + randomNumber + ".";
                result.style.color = "red";
                return;
            }

            if (userGuess === randomNumber) {
                result.textContent = "Congratulations! You guessed the number " + randomNumber + " in " + attempts + " attempts.";
                result.style.color = "green";
            } else if (userGuess < randomNumber) {
                result.textContent = "Too low! Try again.";
                result.style.color = "red";
            } else {
                result.textContent = "Too high! Try again.";
                result.style.color = "red";
            }
        }

        document.getElementById("guessButton").addEventListener("click", checkGuess);
    </script>
</body>
</html>

<html>
    <head>
        <title>Grids</title>
        <style>
            .container1{
                height: 90vh;
                display: grid;
                grid-template-columns: repeat(auto-fill,minmax(150px,1fr));
                grid-template-areas:
                "box1 box1 box2"
                "box3 box4 box2"
                "box3 box4 box2"
                "box3 box5 box5";
                gap: 15px;


            }
            .container1>div{
                outline: 1px solid black;
            }
            .container1>div:nth-child(1){
                background-color: red;
            }
            .container1>div:nth-child(2){
                background-color: black;
            }
            .container1>div:nth-child(3){
                background-color: orange;
            }
            .container1>div:nth-child(4){
                background-color: green;
            }
            .container1>div:nth-child(5){
                background-color: yellow;
            }
            .container2{
                height: 90vh;
                display: grid;
                grid-template-columns: repeat(auto-fill,minmax(150px,1fr));
                gap: 15px;
            }
            .container2>div{
                outline: 1px solid black;
            }
        </style>
    </head>
    <body>
        <div class = "container1">
            <div style = "grid-area:box1;">Box 1</div>
            <div style = "grid-area:box2;">Box 2</div>
            <div style = "grid-area:box3;">Box 3</div>
            <div style = "grid-area:box4;">Box 4</div>
            <div style = "grid-area:box5;">Box 5</div>

        </div>
    </body>

</html>

<html>
    <head>
        <title>
            CSS Selectors
        </title>
        <style>
            *{
                margin: 0;            
                padding: 0;
            }
            #myId{
                color: green;
            }
            .myclass{
                color:red;
            }
            input[type = "email"]{
                color: red;
                border-radius: 5px;
            }
            input[type= "password"]{
                color:blue;
                border-radius: 5px;
            }
            [class|='top']{
                background-color: yellow;
                color: red;
            }
            h5{
                background-color: blue;
                font-size: 20px;
            }
            ul>li.myclass>span{
                background-color:black;
            }
            h3+p{
                color: aqua;
            }
        </style>

    </head>
    <body>
        <div>
            <h3>Heading</h3>
            <p>Paragraph1</p>
            <p>Paragraph2</p>
        </div>
        <h2>Selectors</h2>
        <ul>

            <li class = "myclass">Universal Selector
                <span>123</span>
            </li>
            <li id = "myId">Id Selector</li>
            <li class = "myclass">Class Selector</li>
            <li class = 'top-content'>Attribute Selector</li>
            <li>Element Selector</li>
            <li>Combinators</li>
            <li>Pseudo-classes</li>
            <li><Pseudo-elements></Pseudo-elements></li>

        </ul>
        <input type = "email",placeholder = 'Enter your email: '><br><br>
        <input type = "password",placeholder = "Enter your password: ">
        <p class = "topcorner"> This is the paragraph with attribute selector</p>
        <h5> This is the heading with element selector</h5>
    </body>
</html>

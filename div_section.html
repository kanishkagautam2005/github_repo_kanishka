<html>
    <head>
        <title>Div Section Example</title>
        <style>
            h2 + p{
                color: blue;
            }
            h2 ~ p{
                text-transform:uppercase;
            }
            section h2{
                color: yellow;
                text-shadow: 1px 1px 0 black;
            }
            section>h2{
                text-transform: lowercase;
            }
        </style>
    </head>
    
    <body>
        <section>
            <h2>Heading</h2>
            <p>Para 1</p>
            <p>Para 2</p>
            <div>
                <h2>Heading 2</h2>

            </div>
        </section>
    </body>
</html>

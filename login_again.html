<html>
    <head>
        <title> Login Page</title>
        <style>
          .container{
            display: flex;
            flex-direction: column;
            border: 1px solid black;
            border-radius: 10px;
            justify-content: center;
            align-items: center;
            height: 97vh;
            width: 97vh;
            margin: auto;
            background-color: #dedede;
          }
          #login{
             min-width: 300px;
             max-width: 300px;
             padding: 20px;
             background-color: #ffffff;
             border-radius: 10px;
             border: 1px solid black;
             box-shadow: none;
             height: 30vh;
             width: 30vh;
          }
          #login h2{
            text-align: center;
            margin: 0;
            color: red;
            padding: 10px;

          }
          #login form{
            display: flex;
            background-color: #ffffff;
            flex-direction: column;

          }
        </style>
    </head>
    <body>
         <div class = "container">
            <div id = "login">
                <h2> Login</h2>
                <form>

                    <input type = "text" placeholder = "Username" name = "username" required><br><br>
                    <input type = "password" placeholder = "Password" name = "password" required><br><br>
                    <button type = "submit">Login</button>
                </form>
            </div>
         </div>
    </body>
</html>
